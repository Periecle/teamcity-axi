name: Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: go test -race ./...
      - run: make test-package
  released-cli-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download pinned official CLI
        run: |
          mkdir -p "$RUNNER_TEMP/teamcity-native"
          curl -fLsS https://github.com/JetBrains/teamcity-cli/releases/download/v1.5.0/teamcity_1.5.0_linux_x86_64.tar.gz -o "$RUNNER_TEMP/teamcity-native/release.tar.gz"
          echo "73136b2b3176b20ad9719edeca08ba6961864b8e2ffa916f0903390c0fe48c4c  $RUNNER_TEMP/teamcity-native/release.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/teamcity-native/release.tar.gz" -C "$RUNNER_TEMP/teamcity-native"
      - run: make test-real-cli TEAMCITY_AXI_TEST_BINARY="$RUNNER_TEMP/teamcity-native/teamcity"
