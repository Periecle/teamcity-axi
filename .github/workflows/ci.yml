name: foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run
  released-cli-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download and verify pinned official CLI
        run: |
          mkdir -p "$RUNNER_TEMP/teamcity-native"
          curl -fLsS https://github.com/JetBrains/teamcity-cli/releases/download/v1.5.0/teamcity_1.5.0_linux_x86_64.tar.gz -o "$RUNNER_TEMP/teamcity-native/release.tar.gz"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {createHash} from "node:crypto"; const manifest=JSON.parse(readFileSync("docs/compatibility.json")); const artifact=manifest.artifacts.find(a=>a.archive.endsWith("linux_x86_64.tar.gz")); const actual=createHash("sha256").update(readFileSync(process.env.RUNNER_TEMP+"/teamcity-native/release.tar.gz")).digest("hex"); if(actual!==artifact.archiveSha256) throw Error("Archive checksum mismatch");'
          tar -xzf "$RUNNER_TEMP/teamcity-native/release.tar.gz" -C "$RUNNER_TEMP/teamcity-native"
      - name: Verify actual native requests against local mock
        run: TEAMCITY_AXI_TEST_BINARY="$RUNNER_TEMP/teamcity-native/teamcity" npm run test:real-cli
